<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2157">
<meta name="description" content="مداد — ابحث عن الكتب واقرأها، والأولوية للكتاب العربي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مداد">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مداد — مكتبتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ وفاخر، مثل مكتبة مخطوطات حديثة
   IDEA: صفحة مخطوطة مذهّبة — حبر بنفسجي وورق ذهب
   PICTURE: أغلفة مزخرفة بنجمة ثمانية، وبطاقة كتاب اليوم كبيرة
   COLOUR/TYPE: حبر بنفسجي #3b2157، ذهب #c79a2e، أبيض؛ أميري للعناوين و IBM Plex Arabic للواجهة
   LAYOUT: تطبيق جوال بشريط سفلي خماسي؛ قارئ ملء الشاشة؛ نوافذ سفلية */
:root{color-scheme:light dark;--bg:light-dark(#fbfafc,#120e17);--card:light-dark(#fff,#1c1724);--ink:light-dark(#1d1626,#f1ecf6);--mute:light-dark(#6c6478,#a59db2);--line:light-dark(#ece8f1,#2b2436);--plum:light-dark(#3b2157,#c3a6ea);--plumbg:light-dark(#3b2157,#2a1b3d);--gold:#c79a2e;--soft:light-dark(#f2eef7,#231c2d);--ok:light-dark(#1d7a4a,#5fd39a);--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:light-dark(#e9e4ef,#0a080d);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{position:relative;max-width:440px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:600px){.app{height:min(900px,96dvh);margin:2dvh auto;border-radius:34px;box-shadow:0 30px 80px rgb(30 15 50/.25);border:1px solid var(--line)}}
#view{flex:1;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}
.rtop{padding-top:calc(8px + env(safe-area-inset-top))!important}
.inst{display:none;align-items:center;gap:12px;background:var(--plumbg);color:#f5eefb;border-radius:18px;padding:12px 14px;margin-top:14px}
.inst.on{display:flex}.inst img{width:42px;height:42px;border-radius:11px}.inst div{flex:1;font-size:14px}.inst .x{color:#cdbfe0;min-width:36px;min-height:36px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--mute);min-height:52px;border-radius:14px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--plum);font-weight:600}
.nav button.on svg{stroke:var(--gold)}
h1{font:700 30px/1.15 Amiri,serif;margin:0}
h2{font:700 21px/1.2 Amiri,serif;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 button,h2 small{font:500 13px "IBM Plex Sans Arabic";color:var(--plum)}
.mut{color:var(--mute);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font:700 24px Amiri;color:var(--plum)}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--plumbg);display:grid;place-items:center;color:var(--gold);font-style:normal;font-size:20px}
.sbar{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:0 14px;height:50px;margin-top:16px;color:var(--mute);width:100%;text-align:start}
.sbar input{flex:1;border:0;background:none;font-size:16px;outline:none;height:100%;color:var(--ink)}
.feat{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:18px -18px 0;padding:0 18px 4px;scrollbar-width:none}
.hero{flex:none;width:100%;scroll-snap-align:center;background:var(--plumbg);color:#f5eefb;border-radius:24px;padding:18px;display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:center;position:relative;overflow:hidden;text-align:start}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgb(199 154 46/.38),transparent 70%)}
.hero>div{position:relative;z-index:1}
.hero h3{font:700 22px/1.2 Amiri;margin:6px 0 2px}
.hero .mut{color:#cdbfe0}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line);transition:.25s}
.dots i.on{width:18px;background:var(--gold)}
.bar{height:6px;border-radius:9px;background:rgb(127 110 150/.25);overflow:hidden;margin:10px 0 6px}
.bar b{display:block;height:100%;background:var(--gold);border-radius:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;background:var(--gold);color:#241500;font-weight:600}
.btn.alt{background:var(--soft);color:var(--plum)}
.btn.ink{background:var(--plumbg);color:#fff}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-top:14px}
.goal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center}
.goal svg{width:70px;height:70px}
.quote{background:linear-gradient(150deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.quote p{margin:0;font:700 17px/1.7 Amiri;color:var(--plum)}
.quote button{align-self:flex-start;font-size:13px;color:var(--mute);min-height:32px}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.rail>*{scroll-snap-align:start;flex:none;width:116px}
.bk{text-align:start}
.bk p{margin:8px 0 0;font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk span{font-size:12px;color:var(--mute)}
.cv{position:relative;aspect-ratio:2/3;border-radius:6px 14px 14px 6px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12%;box-shadow:inset -6px 0 0 rgb(0 0 0/.18),0 8px 18px rgb(30 15 50/.22);transition:transform .2s}
.bk:active .cv{transform:scale(.97)}
.cv svg{position:absolute;inset:0;width:100%;height:100%}
.cv::before{content:"";position:absolute;inset:7%;border:1px solid rgb(255 230 170/.55);border-radius:4px 10px 10px 4px}
.cv b{position:relative;font:700 1.15em/1.2 Amiri;text-wrap:balance;text-shadow:0 1px 6px rgb(0 0 0/.3)}
.cv i{position:relative;font-style:normal;font-size:.7em;opacity:.85;margin-top:6px}
.cv.en b{font-family:Georgia,serif}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:58px;text-align:start;font-weight:600;font-size:15px}
.cat em{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-style:normal;font:700 18px Amiri;color:#fff;flex:none}
.cat small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;white-space:nowrap}
.chip.on{background:var(--plumbg);color:#f5eefb;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px;margin-top:14px}
.row{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:start;width:100%}
.row .cv{font-size:9px;padding:8%}
.row h4{margin:0;font-size:15px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--plum);margin-top:4px}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.empty b{display:block;font:700 22px Amiri;color:var(--ink);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:14px;padding:4px;margin-top:16px}
.seg button{min-height:42px;border-radius:11px;font-size:13px;color:var(--mute);line-height:1.2}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgb(0 0 0/.08)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.stat b{display:block;font:700 26px/1.1 Amiri;color:var(--plum)}
.stat span{font-size:12px;color:var(--mute)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px 8px}
.week div{display:grid;gap:4px;justify-items:center;height:100%;align-content:end;font-size:11px;color:var(--mute)}
.week i{width:70%;border-radius:6px 6px 3px 3px;background:var(--plum);min-height:3px}
.week .td i{background:var(--gold)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.set label{font-weight:500}
.sw{position:relative;width:50px;height:30px;border-radius:99px;background:var(--line);flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgb(0 0 0/.2)}
.sw.on{background:var(--plum)}.sw.on::after{right:23px}
input[type=range]{accent-color:var(--gold);width:140px;height:44px}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bdg{text-align:center;font-size:12px;color:var(--mute)}
.bdg i{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 6px;border-radius:50%;font:700 22px Amiri;font-style:normal;background:var(--soft);color:var(--mute);border:2px dashed var(--line)}
.bdg.on i{background:radial-gradient(circle at 30% 30%,#f3d27a,var(--gold));color:#3a2600;border:0;box-shadow:0 6px 16px rgb(199 154 46/.35)}
.bdg.on{color:var(--ink)}
.chal{background:var(--plumbg);color:#f5eefb;border-radius:20px;padding:16px;margin-top:14px}
.chal b{font:700 30px Amiri}
/* sources */
.src{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.src header{display:flex;align-items:center;gap:12px}
.src em{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font:700 20px Amiri;font-style:normal;flex:none}
.src h4{margin:0;font-size:16px}
.src .u{font-size:12px;color:var(--mute);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src footer{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute);flex-wrap:wrap}
.src footer .sp{flex:1}
.src footer button{min-height:36px;padding:0 12px;border-radius:10px;background:var(--soft);color:var(--plum);font-size:13px}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--ok)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.live.off{color:var(--mute)}.live.wait{color:var(--gold)}
.addsrc{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:16px;border-radius:20px;border:1.5px dashed var(--plum);color:var(--plum);text-align:start;background:var(--soft)}
.addsrc i{width:44px;height:44px;border-radius:13px;background:var(--plumbg);color:var(--gold);display:grid;place-items:center;font-size:26px;font-style:normal;flex:none}
.spin{animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block;margin-top:14px}
.field span{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
.field input.url{direction:ltr;text-align:left}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--mute);text-align:start}
.check input{width:22px;height:22px;accent-color:var(--plum);flex:none;margin-top:1px}
.steps{list-style:none;margin:16px 0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--mute);transition:.3s}
.steps li i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--soft);flex:none}
.steps li.on{color:var(--ink)}.steps li.on i{background:var(--gold);color:#241500}
.steps li.ok{color:var(--ink)}.steps li.ok i{background:var(--ok);color:#fff}
.alert{border-radius:16px;padding:14px;margin-top:14px;font-size:14px}
.alert.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.alert.info{background:var(--soft);color:var(--ink)}
/* sheet */
.scrim{position:absolute;inset:0;background:rgb(15 8 25/.5);opacity:0;pointer-events:none;transition:.25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset:auto 0 0;max-height:90%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px 26px;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:6}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.dhead{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:end}
.dhead h3{font:700 26px/1.15 Amiri;margin:0 0 4px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px}
.meta b{display:block;font-size:15px}.meta span{font-size:11px;color:var(--mute)}
.acts{display:grid;grid-template-columns:1fr auto;gap:10px}
.shelf{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ai{margin-top:16px;border-radius:18px;padding:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 14%,transparent),var(--soft))}
.ai b{display:flex;align-items:center;gap:6px;color:var(--plum)}
.ai p{margin:8px 0 0;font-size:15px}
.ai ul{margin:8px 0 0;padding-inline-start:20px;font-size:14px}
/* reader */
.reader{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--rbg);color:var(--rink);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.reader.on{transform:none}
.reader[data-t=light]{--rbg:#fff;--rink:#1d1626;--rmute:#8a8295;--rline:#eee9f3;--hl:#fde68a}
.reader[data-t=sepia]{--rbg:#f4ecd8;--rink:#46382a;--rmute:#8f7a60;--rline:#e4d7b9;--hl:#f1cf6b}
.reader[data-t=night]{--rbg:#0f0c13;--rink:#d9d2e2;--rmute:#7c7389;--rline:#241e2c;--hl:#5b4a12}
.rtop,.rbot{display:flex;align-items:center;gap:2px;padding:8px 8px;border-bottom:1px solid var(--rline)}
.rbot{border:0;border-top:1px solid var(--rline);flex-direction:column;align-items:stretch;padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.rtop b{flex:1;font:700 17px Amiri;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib svg{width:21px;height:21px}
.ib.on{background:color-mix(in srgb,var(--gold) 22%,transparent)}
.ib.on svg{stroke:var(--gold)}
#rmark.on svg{fill:var(--gold)}
.page{flex:1;overflow-y:auto;padding:22px 26px;font-family:var(--rf);font-size:var(--rs);line-height:var(--rl);text-align:justify;animation:pg .3s ease}
@keyframes pg{from{opacity:.2;transform:translateX(var(--dir,0))}to{opacity:1;transform:none}}
.page h5{font:700 1.3em Amiri;text-align:center;margin:0 0 .8em;color:var(--gold)}
.page p{margin:0 0 1em;border-radius:6px;transition:background .2s}
.page p.hl{background:var(--hl);box-shadow:0 0 0 4px var(--hl)}
.reader.hlm .page p{cursor:pointer;outline:1px dashed var(--rline);outline-offset:4px}
.page .note{font:13px "IBM Plex Sans Arabic";color:var(--rmute);text-align:center;border-top:1px dashed var(--rline);padding-top:10px}
.rnav{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--rmute)}
.rnav input{flex:1;width:auto}
.pnl{position:absolute;inset:auto 10px 118px;max-height:60%;overflow-y:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 20px 50px rgb(0 0 0/.25);display:none}
.pnl.on{display:block}
.pnl .set{padding:10px 0}
.pnl h6{font:700 18px Amiri;margin:0 0 8px}
.toc button{display:flex;justify-content:space-between;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);min-height:44px}
.toc button.cur{color:var(--plum);font-weight:700}
.step{display:flex;gap:6px}
.step button{min-width:44px;height:40px;border-radius:12px;background:var(--soft);font-weight:700;padding:0 8px}
.thm{display:flex;gap:10px}
.thm button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}
.thm button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.hlbar{display:none;background:var(--gold);color:#241500;text-align:center;font-size:13px;padding:6px;font-weight:600}
.reader.hlm .hlbar{display:block}
.toast{position:absolute;bottom:92px;left:50%;transform:translate(-50%,20px);background:var(--plumbg);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.badge{font-size:11px;background:var(--gold);color:#241500;padding:2px 9px;border-radius:99px;font-weight:600}
.splash{position:absolute;inset:0;z-index:40;background:#2a1b3d;display:grid;place-items:center;color:#f5eefb;transition:opacity .5s,visibility .5s}
.splash.off{opacity:0;visibility:hidden}
.splash div{text-align:center;animation:rise .8s cubic-bezier(.2,.8,.2,1)}
.splash i{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 14px;border-radius:24px;background:#3b2157;color:var(--gold);font:700 46px Amiri;font-style:normal;box-shadow:0 0 0 1px rgb(199 154 46/.5),0 20px 50px rgb(0 0 0/.4)}
.splash b{font:700 34px Amiri;display:block}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="pt" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M17 3l4 8 8-4-4 8 8 4-8 4 4 8-8-4-4 8-4-8-8 4 4-8-8-4 8-4-4-8 8 4z" fill="rgb(255 240 200/.11)"/></pattern>

  const st=['فحص الرابط والاتصال','كشف نوع المصدر','قراءة الفهرس','مطابقة الحقول وتصنيف الكتب','إزالة المكرر والفهرسة'];
  const found=a.d.known?EXTRA.filter(b=>b.src===a.d.id):[];
  sheetOn(`<h2 style="margin-top:0">${a.step==='done'?'✓ تم التعرّف على المصدر':'جارٍ الربط الذكي…'}</h2><div class="u mut" style="direction:ltr;text-align:right">${esc(a.u)}</div>
  <ol class="steps">${st.map((t,i)=>`<li class="${i<a.i?'ok':i===a.i?'on':''}"><i>${i<a.i?'✓':i===a.i?'<span class="spin">◌</span>':ar(i+1)}</i>${t}${i===1&&a.i>1?` — <b>${esc(a.d.type)}</b>`:''}</li>`).join('')}</ol>
  ${a.step==='done'?(a.d.known?`<div class="alert info">عُثر على <b>${ar(found.length)}</b> كتاب في المعاينة · الترخيص: ${esc(a.d.lic)}</div><div class="rail" style="margin-top:12px">${found.map(b=>`<div class="bk">${cover(b)}<p>${esc(b.t)}</p></div>`).join('')}</div>`
  :`<div class="alert info">النوع المتوقع: <b>${esc(a.d.type)}</b>. في التطبيق الفعلي يجلب الخادم الفهرس الحقيقي ويزامنه؛ المعاينة لا تتصل بالإنترنت، فسيظهر المصدر «بانتظار الخادم».</div>`)
  +`<div class="acts" style="margin-top:16px"><button class="btn full" data-act="confirmsrc">إضافة إلى مداد</button><button class="btn alt" data-act="close">إلغاء</button></div>`:''}`);
 }
}
function detect(u,name){
 const h=u.trim().toLowerCase();
 if(BLOCK.some(b=>h.includes(b)))return{blocked:true};
 let host;try{host=new URL(/^https?:/.test(h)?h:'https://'+h).hostname}catch(e){return{bad:true}}
 if(!host.includes('.'))return{bad:true};
 const k=Object.keys(KNOWN).find(d=>host.endsWith(d));
 if(k)return{...KNOWN[k],known:true,u:host};
 const type=/opds|atom|\.xml/.test(h)?'OPDS':/api|\.json|graphql/.test(h)?'REST / JSON':/rss|feed/.test(h)?'RSS':'صفحة ويب (schema.org)';
 return{id:'c'+Date.now(),n:name||host,type,c:'#6b3d22',lic:'حسب المصدر',custom:true,u:host};
}
function runScan(){
 add.i=0;addSheet();
 const tick=()=>{if(!add)return;add.i++;if(add.i>=5){add.step='done';addSheet();return}addSheet();add.t=setTimeout(tick,650)};
 add.t=setTimeout(tick,650);
}

function para(id,p,i){const sd=id.charCodeAt(0)+id.charCodeAt(1);return POOL[(p*3+i+sd)%POOL.length]}
function openReader(id,page){
 const b=byId[id];cur=id;
 if(!S.lib[id]||S.lib[id].s!=='reading'){const o=S.lib[id];S.lib[id]={s:'reading',p:o&&o.s!=='done'?o.p:1,marks:o?o.marks:[]}}
 if(page)S.lib[id].p=page;
 S.lib[id].last=Date.now();save();
 $('#rtitle').textContent=b.t;$('#rprog').max=b.pages;
 closeSheet();applyR();drawPage(0);$('#reader').classList.add('on');rStart=Date.now();
}
function applyR(){
 const r=$('#reader'),s=S.set;r.dataset.t=s.theme;
 r.style.setProperty('--rs',s.fs+'px');r.style.setProperty('--rl',s.lh);r.style.setProperty('--rf',`"${s.font}",serif`);
 $('#fonts').innerHTML=FONTS.map(f=>`<button style="font-family:'${f[0]}';${s.font===f[0]?'background:var(--plumbg);color:#fff':''}" data-font="${f[0]}">${f[1]}</button>`).join('');
 $('#thm').innerHTML=thm();
}
function drawPage(dir){
 const b=byId[cur],e=S.lib[cur],p=e.p;
 const ch=Math.floor((p-1)/20)+1,first=(p-1)%20===0,hl=(S.hl[cur]||{})[p]||[];
 const pg=$('#page');pg.style.setProperty('--dir',dir?(dir>0?'-24px':'24px'):'0');pg.style.animation='none';void pg.offsetWidth;pg.style.animation='';
 pg.innerHTML=`${first?`<h5>الفصل ${ar(ch)}</h5>`:''}${[0,1,2].map(i=>`<p data-i="${i}" class="${hl.includes(i)?'hl':''}">${para(cur,p,i)}</p>`).join('')}<p class="note">نص معاينة — يُعرض هنا نص «${esc(b.t)}» من المصدر عند الربط</p>`;
 pg.scrollTop=0;$('#rprog').value=p;
 $('#rpg').textContent=`صفحة ${ar(p)} من ${ar(b.pages)} · الفصل ${ar(ch)}`;
 const left=b.pages-p;$('#rleft').textContent=left?`باقي ${ar(Math.ceil(left*1.6))} دقيقة`:'آخر صفحة';
 $('#rmark').classList.toggle('on',e.marks.includes(p));
}
function turn(d){
 stopTTS();
 const b=byId[cur],e=S.lib[cur],n=Math.min(b.pages,Math.max(1,e.p+d));
 if(n===e.p){if(d>0){e.s='done';save();toast('مبروك! أنهيت الكتاب 🎉')}return}
 e.p=n;e.last=Date.now();save();drawPage(d);
}
function stopTTS(){try{speechSynthesis.cancel()}catch(e){}$('#tts').classList.remove('on')}
function closeReader(){
 stopTTS();
 const mins=Math.max(1,Math.round((Date.now()-rStart)/60000));
 S.days[today()]=(S.days[today()]||0)+mins;save();
 hlMode=false;$('#reader').classList.remove('hlm');$('#hlb').classList.remove('on');
 $('#reader').classList.remove('on');document.querySelectorAll('.pnl').forEach(x=>x.classList.remove('on'));render();
}
function toc(){const b=byId[cur],p=S.lib[cur].p,n=Math.ceil(b.pages/20);
 $('#rtocp').innerHTML=`<h6>الفهرس</h6>${[...Array(n)].map((_,i)=>`<button class="${Math.floor((p-1)/20)===i?'cur':''}" data-tj="${i*20+1}"><span>الفصل ${ar(i+1)}</span><span class="mut">ص ${ar(i*20+1)}</span></button>`).join('')}`}

document.addEventListener('click',ev=>{
 const t=ev.target.closest('button,[data-act]');if(!t)return;const d=t.dataset;
 if(d.tab){if(d.lang)fLang=d.lang;go(d.tab,d.focus);return}
 if(d.open){openBook(d.open);return}
 if(d.read){openReader(d.read);return}
 if(d.jump){openReader(d.id,+d.jump);return}
 if(d.tj){S.lib[cur].p=+d.tj;save();drawPage(1);$('#rtocp').classList.remove('on');return}
 if(d.cat){fCat=d.cat;fLang='all';fSrc='all';go('explore');return}
 if(d.fl){fLang=d.fl;render();return}
 if(d.fc){fCat=d.fc;render();return}
 if(d.fs){fSrc=d.fs;render();return}
 if(d.so){sort=d.so;render();return}
 if(d.rq){q=d.rq;render();return}
 if(d.lt){libTab=d.lt;render();return}
 if(d.ai){aiOpen[d.ai]=1;openBook(d.ai,1);return}
 if(d.shelf){const e=S.lib[d.id];if(e&&e.s===d.shelf){delete S.lib[d.id];toast('أُزيل من مكتبتك')}else{S.lib[d.id]={s:d.shelf,p:d.shelf==='done'?byId[d.id].pages:(e?e.p:1),marks:e?e.marks:[],last:Date.now()};toast('تم الحفظ في مكتبتك')}save();openBook(d.id,1);render();return}
 if(d.th){S.set.theme=d.th;save();applyR();if(tab==='profile')render();return}
 if(d.font){S.set.font=d.font;save();applyR();return}
 if(d.tog){const s=srcOf(d.tog);s.on=!s.on;save();render();toast(s.on?`تم تفعيل ${s.n}`:`تم إيقاف ${s.n}`);return}
 if(d.sync){const el=$('#sy-'+d.sync);if(el)el.innerHTML='<span class="spin">⟳</span> جارٍ…';setTimeout(()=>{srcOf(d.sync).sync=Date.now();save();render();toast('تمت المزامنة')},1200);return}
 if(d.del){S.src=S.src.filter(s=>s.id!==d.del);save();render();toast('حُذف المصدر');return}
 if(d.sg){add.u=d.sg;add.n=$('#sn').value;add.ok=$('#sok').checked;add.err='';addSheet();return}
 const a=d.act;
 if(a==='close'){if(add)clearTimeout(add.t);closeSheet()}
 else if(a==='addsrc'){add={step:'form'};addSheet()}
 else if(a==='scan'){add.u=$('#su').value.trim();add.n=$('#sn').value.trim();add.ok=$('#sok').checked;
  if(!add.u){add.err='الصق رابط المصدر أولاً';addSheet();return}
  const r=detect(add.u,add.n);
  if(r.blocked){add.err='<b>هذا المصدر غير مدعوم.</b> ينشر كتباً محمية بحقوق النشر بدون إذن أصحابها، لذلك لا يمكن ربطه بمداد.';addSheet();return}
  if(r.bad){add.err='الرابط غير صحيح، تأكد منه وحاول مرة أخرى';addSheet();return}
  if(!add.ok){add.err='يلزم تأكيد حق الوصول إلى المصدر قبل الربط';addSheet();return}
  if(S.src.some(s=>s.id===r.id||s.u===r.u)){add.err='هذا المصدر مضاف مسبقاً';addSheet();return}
  add.d=r;add.step='scan';add.err='';runScan()}
 else if(a==='confirmsrc'){const r=add.d;S.src.push({id:r.id,n:add.n||r.n,u:r.u,type:r.type,c:r.c,on:true,sync:r.known?Date.now():0,lic:r.lic,custom:!r.known||undefined});save();closeSheet();render();toast('أُضيف المصدر ✓')}
 else if(a==='install'){if(deferred){deferred.prompt();deferred.userChoice.finally(()=>{deferred=null;render()})}}
 else if(a==='instx'){try{localStorage.setItem('midad-inst','x')}catch(e){}render()}
 else if(a==='copyq'){try{navigator.clipboard.writeText('أعز مكان في الدنى سرج سابح ... وخير جليس في الزمان كتاب — المتنبي').then(()=>toast('نُسخ البيت'),()=>toast('تعذّر النسخ'))}catch(e){toast('تعذّر النسخ')}}
 else if(a==='rclose')closeReader();
 else if(a==='next')turn(1);else if(a==='prev')turn(-1);
 else if(a==='rset'){$('#rtocp').classList.remove('on');$('#rsetp').classList.toggle('on')}
 else if(a==='rtoc'){$('#rsetp').classList.remove('on');toc();$('#rtocp').classList.toggle('on')}
 else if(a==='hlm'){hlMode=!hlMode;$('#reader').classList.toggle('hlm',hlMode);t.classList.toggle('on',hlMode)}
 else if(a==='tts'){try{if(speechSynthesis.speaking){stopTTS();return}const u=new SpeechSynthesisUtterance([...$('#page').querySelectorAll('p[data-i]')].map(p=>p.textContent).join(' '));u.lang=byId[cur].lang==='ar'?'ar-SA':'en-US';u.rate=.95;u.onend=()=>$('#tts').classList.remove('on');speechSynthesis.speak(u);t.classList.add('on')}catch(e){toast('القراءة الصوتية غير متاحة هنا')}}
 else if(a==='rmark'){const e=S.lib[cur],i=e.marks.indexOf(e.p);if(i>-1){e.marks.splice(i,1);toast('أُزيلت العلامة')}else{e.marks.push(e.p);toast('أُضيفت علامة 🔖')}save();drawPage(0)}
 else if(a==='fs+'||a==='fs-'){S.set.fs=Math.min(30,Math.max(14,S.set.fs+(a==='fs+'?2:-2)));save();applyR()}
 else if(a==='lh+'||a==='lh-'){S.set.lh=Math.min(2.6,Math.max(1.5,+(S.set.lh+(a==='lh+'?.2:-.2)).toFixed(1)));save();applyR()}
 else if(a==='arFirst'){S.set.arFirst=!S.set.arFirst;save();render();toast(S.set.arFirst?'العربية أولاً: مفعّل':'العربية أولاً: متوقف')}
 else if(a==='reset'){S=seed();save();render();toast('تمت الإعادة')}
});
$('#scrim').onclick=()=>{if(add)clearTimeout(add.t);closeSheet()};
$('#rprog').oninput=e=>{S.lib[cur].p=+e.target.value;save();drawPage(0)};
$('#page').onclick=e=>{
 document.querySelectorAll('.pnl').forEach(x=>x.classList.remove('on'));
 if(hlMode){const p=e.target.closest('p[data-i]');if(!p)return;const i=+p.dataset.i,pg=S.lib[cur].p;S.hl[cur]=S.hl[cur]||{};const arr=S.hl[cur][pg]=S.hl[cur][pg]||[];const k=arr.indexOf(i);if(k>-1)arr.splice(k,1);else arr.push(i);if(!arr.length)delete S.hl[cur][pg];save();p.classList.toggle('hl');toast(k>-1?'أُزيل التظليل':'تم التظليل ✓');return}
 const r=$('#page').getBoundingClientRect(),x=e.clientX-r.left;if(x<r.width*.28)turn(1);else if(x>r.width*.72)turn(-1)};
let tx=0;$('#page').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#page').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)turn(dx>0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if(!$('#reader').classList.contains('on'))return;if(e.key==='ArrowLeft')turn(1);else if(e.key==='ArrowRight')turn(-1);else if(e.key==='Escape')closeReader()});
render();
setTimeout(()=>$('#splash').classList.add('off'),1100);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
